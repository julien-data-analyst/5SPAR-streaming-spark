services:
  marimo:
    build:
      context: ./marimo-spark
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: marimo-spark-dev
    command: marimo edit --no-token --host 0.0.0.0 -p 8080
    env_file:
      - .env
    volumes:
      - ./marimo-spark/scripts:/app/scripts
      - ./marimo-spark/data:/data
    working_dir: /app/scripts
    ports:
      - "${MARIMO_PORT}:8080"
    environment:
      SPARK_REMOTE: sc://spark-worker:15002 # Permet de se connecter au client
    stdin_open: true
    tty: true

  spark:
    image: apache/spark:4.1.1-python3   # vérifie le tag exact sur Docker Hub
    command: /opt/spark/sbin/start-connect-server.sh
    container_name: spark-worker
    volumes:
      - ./spark/data:/data
    environment:
      SPARK_NO_DAEMONIZE: "true"        # garde le process au premier plan
    ports:
      - "4050:4040"     # Spark UI
      - "15002:15002"   # Spark Connect
    
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shopstream
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9094:9094"            # accès depuis la machine hôte : localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # le topic doit être créé à la main (Partie 1)
      
volumes:
  pgdata: