requires-python = ">=3.11" # Modify it if you use a python version under 3.11
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyspark-client==4.1.1",
    "marimo",
    "plotnine" # Python notebook
] # Some standard libairies
